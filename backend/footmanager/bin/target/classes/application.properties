server.port=8080

# ── Datasource ────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/footmanager?useSSL=false&serverTimezone=Europe/Rome&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────────────────
# Chiave >= 256 bit (32 caratteri) per HMAC-SHA256
app.jwt.secret=footmanager-super-secret-jwt-key-2024-footmanager
app.jwt.expiration-ms=86400000

# ── CORS ──────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# ── Logging ───────────────────────────────────────────────────────
logging.level.it.footmanager=DEBUG
logging.level.org.springframework.security=INFO
